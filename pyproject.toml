[project]
name = "public-transportation"
version = "0.1.0"
description = "An analysis of public transportation US across agencies"
requires-python = ">=3.11"
dependencies = [
    "ipython",
    "ipykernel",
    "pandas",
    "polars",
    "matplotlib",
    "notebook",
    "jupyterlab",
    "pyarrow",
    "black",
    "ruff",
    "pre-commit",
    "jupytext",
    "openpyxl>=3.1.5",
    "streamlit>=1.66.1",
    "altair>=6.3.0",
]

[tool.jupytext]
formats = "ipynb,py:percent"
